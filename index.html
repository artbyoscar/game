<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voxel Dungeon Crawler</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            font-family: 'Courier New', monospace;
            background: #000;
        }

        #game-canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }

        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #fff;
            text-shadow: 2px 2px 4px #000;
            font-size: 16px;
            pointer-events: none;
            z-index: 100;
        }

        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 20px;
            height: 20px;
            pointer-events: none;
            z-index: 100;
        }

        #crosshair::before,
        #crosshair::after {
            content: '';
            position: absolute;
            background: rgba(255, 255, 255, 0.8);
        }

        #crosshair::before {
            top: 50%;
            left: 0;
            width: 100%;
            height: 2px;
            transform: translateY(-50%);
        }

        #crosshair::after {
            left: 50%;
            top: 0;
            width: 2px;
            height: 100%;
            transform: translateX(-50%);
        }

        #menu {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.8);
            padding: 40px;
            border: 3px solid #fff;
            color: #fff;
            text-align: center;
            z-index: 200;
        }

        #menu h1 {
            margin-bottom: 20px;
            font-size: 32px;
        }

        #menu p {
            margin-bottom: 10px;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div id="menu">
        <h1>VOXEL DUNGEON</h1>
        <p>Click to Start</p>
        <p style="margin-top: 20px; font-size: 12px;">WASD - Move | SPACE - Jump | Mouse - Look</p>
    </div>

    <div id="hud" class="hidden">
        <div>Floor: <span id="floor-level">1</span></div>
        <div>HP: <span id="player-hp">100</span></div>
        <div>Position: <span id="player-pos">0, 0, 0</span></div>
    </div>

    <div id="crosshair" class="hidden"></div>

    <canvas id="game-canvas"></canvas>

    <script type="module" src="/src/main.ts"></script>
</body>
</html>
